name: Build Frontend and Push to Repo

on:
  push:
    branches: [ master ]
    paths:
      - 'Frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and Build
        run: |
          cd Frontend
          npm install
          npm run build

      - name: Commit and Push build files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Frontend/dist/ -f
          git commit -m "build frontend [skip ci]" || echo "No changes to commit"
          git push